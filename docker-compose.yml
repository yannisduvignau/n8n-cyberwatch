# ---------------------------------------------------------------------------
# n8n — "EU cyber regulation & sovereignty" watch
#
#   docker compose up -d        start
#   docker compose logs -f n8n  logs
#   docker compose down         stop (volumes are kept)
#
# Interface : http://localhost:5678
# ---------------------------------------------------------------------------

services:
  # --- n8n's INTERNAL database: workflows, credentials, execution
  #     history. Holds no monitoring data.
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.68.0
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      veille-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"   # listens locally only
    environment:
      # --- Database connection
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Time zone: the Schedule Trigger and displayed dates use it
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris

      # --- Security
      #     ENCRYPTION_KEY encrypts the credentials stored in the database.
      #     Losing it = having to re-enter every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"          # acceptable since we stay on local HTTP
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # required: Code nodes read $env

      # --- Secrets exposed to Code nodes via $env
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

      # --- Retention: without pruning, the executions table grows forever
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336          # hours (14 days)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all

      # --- Misc
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Code nodes run inside the n8n process. The isolated task runner
      # (N8N_RUNNERS_ENABLED) does not expose fetch() to these nodes, and
      # feed collection depends on it.
      N8N_RUNNERS_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro   # import: see README
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Build: rebuilds workflows/*.json from config/ and src/.
  #     Does not start with the stack ("tools" profile):
  #       docker compose run --rm builder
  #       docker compose run --rm builder --check
  builder:
    image: python:3.12-alpine
    container_name: veille-builder
    profiles: ["tools"]
    working_dir: /projet
    volumes:
      - ./config:/projet/config:ro
      - ./src:/projet/src:ro
      - ./build:/projet/build:ro
      - ./workflows:/projet/workflows
    entrypoint: ["/bin/sh", "/projet/build/entrypoint.sh"]

  # --- Provisioning: creates the Postgres credential and imports the
  #     workflow, then exits. Avoids any manual input in the UI.
  #     Idempotent: restarting the stack creates no duplicates.
  n8n-init:
    image: docker.n8n.io/n8nio/n8n:1.68.0
    container_name: n8n-init
    restart: "no"
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      # Same database and key as n8n: the credential must land in the same
      # place, encrypted with the same key.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Monitoring database credentials, injected into the n8n credential.
      VEILLE_DB: ${VEILLE_DB}
      VEILLE_USER: ${VEILLE_USER}
      VEILLE_PASSWORD: ${VEILLE_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-n8n.sh"]

  # --- BUSINESS database: the monitoring articles. Kept separate from
  #     n8n's so the data survives anything done to the tool.
  #     The scripts in sql/ run when the volume is created.
  veille-db:
    image: postgres:16-alpine
    container_name: veille-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VEILLE_DB}
      POSTGRES_USER: ${VEILLE_USER}
      POSTGRES_PASSWORD: ${VEILLE_PASSWORD}
    volumes:
      - veille_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"   # local access for psql / DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VEILLE_USER} -d ${VEILLE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Exploration and dashboards on the monitoring database.
  #     Metabase keeps its own configuration in its dedicated database.
  metabase:
    image: metabase/metabase:v0.50.21
    container_name: metabase
    restart: unless-stopped
    depends_on:
      veille-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Paris
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  n8n_data:
  postgres_data:
  veille_data:
  metabase_data:
