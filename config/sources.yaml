# ---------------------------------------------------------------------------
# Sources surveillées par la veille.
#
# Ajouter un flux : recopier un bloc, remplir les quatre champs.
# Retirer un flux : supprimer son bloc, ou le commenter pour le garder
# sous la main.
#
#   name      libellé affiché en base et dans Discord
#   url       flux RSS ou Atom
#   category  axe principal présumé (« Multi » si généraliste). Indicatif :
#             c'est le scoring qui décide du thème réel de chaque article.
#   type      nature de la source, utile pour pondérer la confiance
#
# Après modification : docker compose run --rm builder
# ---------------------------------------------------------------------------

