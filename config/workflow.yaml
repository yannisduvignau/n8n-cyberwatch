# ---------------------------------------------------------------------------
# General workflow settings.
#
# This file contains NO secrets: the Discord webhook and database access
# live in .env and in the n8n credentials.
#
# After a change: docker compose run --rm builder
# ---------------------------------------------------------------------------

# Name shown in the n8n UI.
nom: "Veille — NIS2 · CRA · PQC · Cloud souverain"

planification:
  # Interval between two collection runs, in hours.
  intervalle_heures: 2

collecte:
  # Maximum age of an article, in days. Blogs that publish less often
  # become invisible beyond it: raising this value brings them back, at the
  # cost of repeats on every cycle.
  age_max_jours: 7
  # Timeout per feed, in milliseconds.
  timeout_ms: 15000
  # Concurrent downloads. Above ~10, some hosts start returning 429s.
  concurrence: 6
  # Safeguard against huge feeds: entries read per feed and per cycle.
  max_articles_par_flux: 40
  # Hard cap on a feed's raw body, in bytes. max_articles_par_flux only limits
  # entries AFTER parsing; this bounds the download so a hostile or spoofed
  # feed cannot exhaust the worker's memory/CPU before any entry is counted.
  taille_max_octets: 8388608 # 8 MiB

notification:
  # Score from which an article is sent to Discord.
  seuil_alerte: 8
  # Score from which the embed turns red ("very high").
  seuil_urgent: 15

base:
  # Name of the Postgres credential as created in n8n. Must match the one
  # provisioned by scripts/init-n8n.sh.
  credential: "Postgres — base veille"
  credential_id: "veille-db"
