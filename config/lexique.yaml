# ---------------------------------------------------------------------------
# Scoring lexicon.
#
# Each topic has three concentric circles:
#   coeur       the term names the subject itself             3 pts
#   peripherie  the term revolves around the subject          2 pts
#   signaux     weak hint, to be confirmed by the context     1 pt
#
# A term found in the title counts ×2: a subject announced in the title is
# being addressed head-on, whereas an occurrence in the body may be a
# passing mention.
#
# After a change: docker compose run --rm builder
# ---------------------------------------------------------------------------

seuils:
  # Minimum score on a topic for the article to be tagged with that topic.
  axe: 3
  # Minimum total score for the article to be kept.
  # Lower => more noise; higher => narrows down to the core of the subject.
  minimum: 3

poids:
  coeur: 3
  peripherie: 2
  signaux: 1
  bonus_titre: 2

axes:

  NIS2:
    coeur:
      - NIS2
      - NIS 2
      - directive 2022/2555
      - loi résilience
      - projet de loi résilience
      - entités essentielles
      - entités importantes
      - essential entities
      - important entities
    peripherie:
      - ANSSI
      - MonEspaceNIS2
      - ReCyF
      - Référentiel Cyber France
      - transposition
      - directive REC
      - entités critiques
      - critical entities
      - DORA
      - CERT-FR
      - "notification d'incident"
      - incident reporting
      - commission spéciale
    signaux:
      - article 16 bis
      - chiffrement de bout en bout
      - porte dérobée
      - backdoor
      - CJUE
      - "procédure d'infraction"
      - infringement
      - "décret d'application"
      - collectivités territoriales
      - Latombe
      - CSNP

  CRA:
