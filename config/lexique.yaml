      - SBOM
      - marquage CE
      - CE marking
      - normes harmonisées
      - harmonised standards
      - CEN-CENELEC
      - ENISA
      - actively exploited
      - activement exploitées
      - single reporting platform
      - conformity assessment
      - évaluation de la conformité
      - vulnerability handling
      - gestion des vulnérabilités
    signaux:
      - open source steward
      - organismes notifiés
      - notified bodies
      - acte délégué
      - delegated act
      - implementing act
      - "acte d'exécution"
      - secure by design
      - support period

  PQC:
    coeur:
      - post-quantique
      - post-quantum
      - PQC
      - ML-KEM
      - ML-DSA
      - SLH-DSA
      - FIPS 203
      - FIPS 204
      - FIPS 205
    peripherie:
      - Kyber
      - Dilithium
      - SPHINCS+
      - FN-DSA
      - HQC
      - hybridation
      - hybrid key exchange
