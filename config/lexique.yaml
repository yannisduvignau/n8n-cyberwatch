  Cloud souverain:
    coeur:
      - SecNumCloud
      - EUCS
      - cloud souverain
      - sovereign cloud
      - Cloud Act
      - cloud de confiance
    peripherie:
      - extraterritorial
      - extraterritoriales
      - FISA
      - section 702
      - Data Act
      - Gaia-X
      - S3NS
      - NumSpot
