# Terms that disqualify an article, whatever its score.
exclusions:
  - "offre d'emploi"
  - job offer
  - recrutement
  - we are hiring
  - webinaire
  - webinar
  - sponsored
  - publi-rédactionnel
  - code promo
  - market size
  - market share
  - CAGR
  - forecast to 20
  - market report
  - quarterly results
  - earnings call
  - Canada Revenue Agency
  - "Dora l'exploratrice"

# ---------------------------------------------------------------------------
# European anchoring
#
# "Sovereign cloud" is a global term: Oracle in India or a Gulf operator
# claim it too. Without anchoring, those articles reach the threshold even
# though the watch is about *European* sovereignty.
#
# An article with no EU marker is penalised, not discarded: a genuinely
# European story remains detectable even if it never names Europe, it will
# simply need more lexicon terms to pass.
# ---------------------------------------------------------------------------
ancrage_ue:
  # Topics concerned. PQC and CRA rely on an already specific vocabulary,
  # they don't need it.
  axes:
    - Cloud souverain
  # Points removed from an article with no European marker at all.
  malus: 4
  marqueurs:
    - europe
    - européen
    - européenne
    - european
    - UE
    - EU
    - Bruxelles
    - Brussels
    - commission européenne
    - european commission
    - parlement européen
    - european parliament
    - France
    - français
    - française
    - french
    - Allemagne
    - German
    - Germany
    - Belgique
    - Belgium
    - Pays-Bas
    - Netherlands
    - Italie
    - Italy
    - Espagne
    - Spain
    - ANSSI
    - BSI
    - ENISA
    - CNIL
    - RGPD
    - GDPR
    - SecNumCloud
    - EUCS
    - Gaia-X
    - NIS2
    - NIS 2
    - Cyber Resilience Act
    - DORA
    - eIDAS
